<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>TaskTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
        .text-strikethrough{
            text-decoration: line-through;
            color:grey;
        }
  </style>
</head>
<body>


    <div class="container">
        <h1 class="mt-5 text-center display-4">TaskTrack</h1>
        <h4 class="mt-1 text-center text-muted">Your Daily Task Companion</h4>
        <form action="/" method="post" class="row mt-3">
            <div class="col-md-10">
                <input class="form-control form-control-lg"
                       type="text"
                       name="title"
                       placeholder="Enter the task to be done"
                        required>
            </div>
            <div class="col-md-2">
                <button type="submit"
                        class="btn btn-primary btn-block btn-lg">Add Task</button>
            </div>
        </form>
        <div class="mt-4">
            <th:block th:each="task: ${tasks}">
                <div class="card mb-2">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <span th:classappend="${task.taskComplete} ? 'text-strikethrough'" th:text="${task.taskTitle}"></span>
                        <div>
                            <a th:href="@{/{id}/complete(id=${task.taskId})}" class="btn btn-outline-secondary btn-sm">Toggle</a>
                            <a th:href="@{/{id}/delete(id=${task.taskId})}" class="btn btn-outline-danger btn-sm ml-2">Delete</a>
                        </div>
                    </div>
                </div>
            </th:block>
        </div>

    </div>
</body>
</html>
